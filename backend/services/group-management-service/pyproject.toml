[project]
name = "group-management-service"
version = "0.1.0"
description = "Group and membership management service for SplitSmart"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.125.0",
    "starlette>=0.49.1,<1.0.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy[asyncio]>=2.0.45,<2.1",
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.3.2",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
]
